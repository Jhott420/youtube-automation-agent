name: Daily Shorts (4 per day)

on:
  schedule:
    # Once a day; the 4 Shorts are uploaded together and YouTube publishes
    # them at the times in shorts-channel/shorts_config.json.
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render only, do not upload (videos are saved as a workflow artifact)'
        type: boolean
        default: false
      count:
        description: 'How many Shorts to make'
        type: string
        default: '4'

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: shorts-channel

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      SHORTS_PRIVACY: ${{ vars.SHORTS_PRIVACY || 'scheduled' }}
      SHORTS_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      SHORTS_COUNT: ${{ inputs.count || '4' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore downloaded background clips
        uses: actions/cache@v4
        with:
          path: shorts-channel/assets/stock/pexels
          key: pexels-${{ github.run_id }}
          restore-keys: pexels-

      - name: Fetch free-to-use background clips (needs PEXELS_API_KEY)
        run: python fetch_backgrounds.py
        continue-on-error: true

      - name: Write, render and schedule Shorts
        run: python run_shorts.py

      - name: Save Shorts history
        if: always() && env.SHORTS_DRY_RUN != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts_state.json
          if git diff --cached --quiet; then
            echo "No history change to commit."
          else
            git commit -m "Shorts: $(python -c 'import json; print(json.load(open("shorts_state.json"))["total_published"])') total"
            git pull --rebase
            git push
          fi

      - name: Keep Shorts as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts
          path: shorts-channel/output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
